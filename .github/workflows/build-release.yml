name: Build Release

# Build dist installers for macOS / Windows / Linux on each OS's own
# runner. This is the safe path because ffmpeg-static and
# ffprobe-static download platform-specific binaries at `npm install`
# time — cross-build packages the wrong-OS binary, which crashes on
# first render. See README "Dist build 결과 (Phase 4-1)" + Phase 4-2
# notes for the full reasoning.

# Quoted to keep YAML 1.1 parsers from coercing `on` to a boolean.
"on":
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'electron.vite.config.ts'
      - '.github/workflows/build-release.yml'

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      # One OS failing shouldn't kill the others — devs can still grab
      # the Linux artifact even if Windows had a transient signing issue.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dist-script: dist:linux
            artifact-name: dist-linux
            artifact-glob: |
              release/*.AppImage
          - os: macos-latest
            dist-script: dist:mac
            artifact-name: dist-mac
            artifact-glob: |
              release/*.dmg
              release/*.zip
          - os: windows-latest
            dist-script: dist:win
            artifact-name: dist-win
            artifact-glob: |
              release/*.exe
              release/*.msi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # `npm ci` is the right choice for CI — uses package-lock.json
        # exactly. The postinstall hook (`electron-builder install-app-deps`)
        # rebuilds native modules for the host OS.
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build sources
        run: npm run build

      - name: Smoke test - fonts registry
        run: npm run test:fonts

      - name: Smoke test - watermark painter
        run: npm run test:watermark

      - name: Smoke test - export presets
        # Real ffmpeg renders × 4 presets. Slowest of the smoke trio
        # (~16s on Linux, longer on Windows). Pulls a host-OS ffmpeg
        # binary and probes the output codec/bitrate/duration to confirm
        # the encode argv reaches the muxer.
        run: npm run test:export-presets

      - name: RC QA harness
        # Items 4-9 of RC-QA.md — watermark on/off renders, safe-zone
        # export exclusion, hook suggester, whisper graceful fallback,
        # Korean+spaced path round-trip, custom preset round-trip.
        # Cross-platform after rc-qa.ts shell:true on win32.
        # On Windows this still runs under pwsh by default; the harness
        # itself spawns child tsx processes via shell:true on win32.
        run: npm run test:rc-qa

      - name: Fetch bundled whisper
        # Phase 5-7/8/8.1 — pulls whisper.cpp's whisper-cli binary +
        # ggml-base into resources/whisper/ so the dist installer ships
        # AI lyric extraction with zero install on the user's machine.
        # The script is idempotent; on Windows it grabs the upstream
        # prebuilt zip, on macOS/Linux it builds statically from source
        # (~3 min on a CI runner; -DBUILD_SHARED_LIBS=OFF produces a
        # standalone binary that doesn't need sidecar .so/.dylib files).
        #
        # Policy split (Phase 5-12.1 — reverted from 5-12 after we
        # made the publish job tag-only):
        #   * Tag pushes (v*) MUST ship whisper — the Release that
        #     gets auto-published would otherwise be a "no AI engine"
        #     build, worse than no Release.
        #   * Main / PR pushes treat the fetch as best-effort. A
        #     transient HF outage or whisper.cpp release page hiccup
        #     shouldn't block validation of the rest of the app.
        #     Main pushes only produce Actions artifacts now (used
        #     for internal smoke testing), not user-facing Releases.
        id: fetch_whisper
        shell: bash
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: scripts/fetch-whisper.sh

      - name: Confirm bundled whisper landed in tree
        # Required on tag pushes (release), best-effort on main / PR.
        # We always log the outcome so the artifact's whisper status
        # is discoverable from the run summary.
        if: ${{ startsWith(github.ref, 'refs/tags/') || steps.fetch_whisper.outcome == 'success' }}
        shell: bash
        run: |
          set -e
          case "${{ runner.os }}" in
            Linux)   plat=linux-x64; bin=whisper-cli ;;
            macOS)
              if [ "$(uname -m)" = "arm64" ]; then plat=darwin-arm64; else plat=darwin-x64; fi
              bin=whisper-cli ;;
            Windows) plat=win32-x64; bin=whisper-cli.exe ;;
          esac
          missing=""
          [ -f "resources/whisper/bin/$plat/$bin" ] \
            || missing="$missing resources/whisper/bin/$plat/$bin"
          [ -f "resources/whisper/models/ggml-base.bin" ] \
            || missing="$missing resources/whisper/models/ggml-base.bin"
          if [ -n "$missing" ]; then
            echo "whisper-status: missing$missing"
            if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
              echo "whisper-status: tag build requires bundled whisper — failing."
              exit 1
            else
              echo "whisper-status: non-tag build — continuing without bundled whisper."
              echo "  (TranscribeButton will surface the friendly fallback.)"
            fi
          else
            echo "whisper-status: included for $plat (binary + ggml-base.bin)"
          fi

      - name: Report whisper inclusion in run summary
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.fetch_whisper.outcome }}" = "success" ]; then
            echo "::notice title=Whisper::included (fetch-whisper succeeded on ${{ runner.os }})"
          elif [ "${{ steps.fetch_whisper.outcome }}" = "failure" ]; then
            echo "::warning title=Whisper::skipped on ${{ runner.os }} (fetch failed; non-tag build continues)"
          else
            echo "::notice title=Whisper::status=${{ steps.fetch_whisper.outcome }} on ${{ runner.os }}"
          fi

      - name: Build dist installer
        # `--publish never` is passed by each dist:* npm script (see
        # package.json). Without it electron-builder would try to push
        # to GitHub Releases at build time and fail with
        # "GH_TOKEN not set" — the publish config in package.json is
        # only needed at RUNTIME for electron-updater's feed lookup,
        # NOT for build-time publishing. Build-time publishing is
        # handled by the dedicated `publish` job below using
        # softprops/action-gh-release which has its own auth.
        run: npm run ${{ matrix.dist-script }}
        env:
          # Skip code signing in CI for now — sign + notarize is a
          # follow-on step that needs Apple Developer ID + Authenticode
          # certs configured as repo secrets. CI artifacts produced here
          # are unsigned and intended for internal testing.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Ad-hoc codesign macOS app (no Apple Developer ID required)
        # macOS Gatekeeper rejects an unsigned .app with "손상되었기
        # 때문에 열 수 없습니다" because the package has no signature
        # AND the quarantine xattr is set when the user downloads it.
        # An ad-hoc signature (`-s -`) is enough for Gatekeeper to fall
        # through to the "unidentified developer" prompt, which the user
        # can clear via right-click → Open. This isn't notarization —
        # users on macOS 15+ may still need to allow the app in Settings
        # → Privacy & Security — but it's a strict improvement over a
        # totally unsigned .app, and it costs nothing.
        if: matrix.os == 'macos-latest'
        run: |
          set -e
          shopt -s nullglob
          for app in release/mac*/*.app release/*.app; do
            if [ -d "$app" ]; then
              echo "Ad-hoc signing: $app"
              codesign --force --deep --sign - "$app" || true
            fi
          done

      - name: Verify packaged ffmpeg/ffprobe binaries
        # Confirms the host-OS binary actually landed in the package.
        # If a future change accidentally swaps the unpack rule, this
        # catches it before artifacts are uploaded. The verifier auto-
        # detects host platform (process.platform) and asserts the
        # matching magic number — Mach-O on macOS, PE on Windows, ELF
        # on Linux.
        run: npx tsx scripts/verify-packaged-binaries.ts

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: warn
          retention-days: 14

  # Phase 5-12 — auto-publish a GitHub Release with the .exe / .dmg /
  # AppImage attached so end users download directly from
  # /releases/latest instead of digging through Actions → run →
  # Artifacts (which requires GitHub auth + 14-day retention).
  #
  # Phase 5-12.1 — restricted to v* TAG pushes only. Main pushes
  # produce Actions artifacts (for internal smoke testing) but do
  # NOT auto-create a Release — to cut a Release the maintainer
  # bumps package.json version and pushes a v<version> tag (or
  # creates the tag via the GitHub Releases UI which also triggers
  # this workflow). Keeps the Releases page clean and prevents
  # accidental Releases on every main merge during active development.
  #
  # Tag scheme: reads version from package.json (e.g. "1.0.0-rc.1")
  # and creates / updates tag "v<version>". The action upserts —
  # if the tag already exists, it updates the existing Release in
  # place with the freshly-built artifacts.
  #
  # Prerelease auto-detection: any version containing -rc / -beta /
  # -alpha is marked as a GitHub pre-release so the auto-updater
  # (electron-updater, releaseType=release in package.json) doesn't
  # auto-deliver to stable users. Bump package.json to "1.0.0"
  # (no suffix) when cutting the actual stable release.
  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # softprops/action-gh-release needs contents:write to create/
      # update Releases AND to create the underlying git tag. Default
      # GITHUB_TOKEN may be read-only depending on repo settings —
      # if this job fails with 403, enable Settings → Actions →
      # General → Workflow permissions → Read and write permissions.
      contents: write
    steps:
      - name: Checkout (need package.json for the version)
        uses: actions/checkout@v4

      - name: Download all matrix artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List downloaded assets (debug)
        run: |
          echo "=== release-assets tree ==="
          find release-assets -type f -printf "%s\t%p\n" | sort -k2

      - name: Read package.json version
        id: pkg
        run: |
          ver=$(node -p "require('./package.json').version")
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          case "$ver" in
            *-rc*|*-beta*|*-alpha*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Version detected: $ver"

      - name: Create / update GitHub Release with installers attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: Lyric Shorts Maker v${{ steps.pkg.outputs.version }}
          prerelease: ${{ steps.pkg.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release-assets/dist-win/**/*
            release-assets/dist-mac/**/*
            release-assets/dist-linux/**/*
          body: |
            ## 다운로드 (Install)

            바로 받아서 설치하시면 됩니다 — Python / Whisper / ffmpeg
            별도 설치 필요 없음, 관리자 권한 필요 없음.

            - **Windows**: 아래 `.exe` 다운로드 → 설치 마법사 → 시작 메뉴에서 실행
            - **macOS**: 아래 `.dmg` 다운로드 → Applications로 드래그 → 첫 실행만 우클릭 → "열기"
            - **Linux**: 아래 `.AppImage` 다운로드 → `chmod +x` → 실행

            ## 첫 실행 시 주의

            - **Windows SmartScreen** 경고가 뜸 → "추가 정보" → "실행"
              (rc 단계라 EV 인증서가 아직 없습니다. 정식 V1.0.0 때 추가 예정.)
            - **macOS Gatekeeper**가 "개발자 확인 안 됨" 표시 → 우클릭 → "열기"
              한 번만 하시면 다음부턴 더블클릭으로 실행됨.

            ## 번들된 것 (별도 설치 0개)

            - **ffmpeg / ffprobe** — 영상 인코딩 + 메타 추출 (OS별 정적 바이너리)
            - **whisper.cpp + ggml-base 모델** (~150 MB) — AI 한국어/영어 가사 자동 인식
            - **번들 폰트** — Pretendard / Inter / Noto Sans KR

            ## 문제 발생 시

            앱 시작 화면 → **🛠 진단 / 업데이트** 펼치기 → **📋 오류 복사하기**
            클릭 → 그 텍스트를 그대로 이슈에 붙여넣어 주세요. 로그에 정확한
            실패 원인이 찍혀 있어서 바로 패치 가능합니다.

            ## V1.0.0-rc.1 주요 변경

            - electron-log 기반 진단/로깅 시스템 (시작 화면 진단 패널)
            - electron-updater 자동 업데이트 스캐폴드 (정식 Release부터 활성화)
            - 14단계 release-qa 게이팅 하네스
            - Whisper 무음 구간 자동 감지 + 친절한 안내 메시지
            - 진행률 바 deterministic 테스트
            - Windows 크로스빌드 풋건 방지 (verify-packaged-binaries 타깃 인식)

            전체 커밋 목록: PR
            [#1](https://github.com/freemilesarea-boop/Louver-Lyric-Shorts-Maker-MVP/pull/1)
