name: Build Release

# Build dist installers for macOS / Windows / Linux on each OS's own
# runner. This is the safe path because ffmpeg-static and
# ffprobe-static download platform-specific binaries at `npm install`
# time — cross-build packages the wrong-OS binary, which crashes on
# first render. See README "Dist build 결과 (Phase 4-1)" + Phase 4-2
# notes for the full reasoning.

# Quoted to keep YAML 1.1 parsers from coercing `on` to a boolean.
"on":
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'electron.vite.config.ts'
      - '.github/workflows/build-release.yml'

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      # One OS failing shouldn't kill the others — devs can still grab
      # the Linux artifact even if Windows had a transient signing issue.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dist-script: dist:linux
            artifact-name: dist-linux
            artifact-glob: |
              release/*.AppImage
          - os: macos-latest
            dist-script: dist:mac
            artifact-name: dist-mac
            artifact-glob: |
              release/*.dmg
              release/*.zip
          - os: windows-latest
            dist-script: dist:win
            artifact-name: dist-win
            artifact-glob: |
              release/*.exe
              release/*.msi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # `npm ci` is the right choice for CI — uses package-lock.json
        # exactly. The postinstall hook (`electron-builder install-app-deps`)
        # rebuilds native modules for the host OS.
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build sources
        run: npm run build

      - name: Smoke test - fonts registry
        run: npm run test:fonts

      - name: Smoke test - watermark painter
        run: npm run test:watermark

      - name: Smoke test - export presets
        # Real ffmpeg renders × 4 presets. Slowest of the smoke trio
        # (~16s on Linux, longer on Windows). Pulls a host-OS ffmpeg
        # binary and probes the output codec/bitrate/duration to confirm
        # the encode argv reaches the muxer.
        run: npm run test:export-presets

      - name: RC QA harness
        # Items 4-9 of RC-QA.md — watermark on/off renders, safe-zone
        # export exclusion, hook suggester, whisper graceful fallback,
        # Korean+spaced path round-trip, custom preset round-trip.
        # Cross-platform after rc-qa.ts shell:true on win32.
        # On Windows this still runs under pwsh by default; the harness
        # itself spawns child tsx processes via shell:true on win32.
        run: npm run test:rc-qa

      - name: Fetch bundled whisper
        # Phase 5-7/8 — pulls whisper.cpp's whisper-cli binary + ggml-base
        # into resources/whisper/ so the dist installer ships AI lyric
        # extraction with zero install on the user's machine. The script
        # is idempotent; on Windows it grabs the upstream prebuilt zip,
        # on macOS / Linux it builds from source statically (~3 min on a
        # CI runner; -DBUILD_SHARED_LIBS=OFF produces a standalone binary
        # that doesn't need sidecar .so/.dylib files).
        #
        # No longer best-effort — Phase 5-8 user spec requires actual AI
        # lyric extraction in shipped installers. A failed fetch fails
        # the build so we never publish a "no AI engine" dist.
        shell: bash
        run: scripts/fetch-whisper.sh

      - name: Confirm bundled whisper landed in tree
        # Belt-and-suspenders: fail fast if the script silently produced
        # nothing (e.g. cmake error swallowed). Both the binary and the
        # model must be on disk before electron-builder packages them.
        shell: bash
        run: |
          set -e
          case "${{ runner.os }}" in
            Linux)   plat=linux-x64; bin=whisper-cli ;;
            macOS)
              if [ "$(uname -m)" = "arm64" ]; then plat=darwin-arm64; else plat=darwin-x64; fi
              bin=whisper-cli ;;
            Windows) plat=win32-x64; bin=whisper-cli.exe ;;
          esac
          test -f "resources/whisper/bin/$plat/$bin" \
            || { echo "MISSING: resources/whisper/bin/$plat/$bin"; exit 1; }
          test -f "resources/whisper/models/ggml-base.bin" \
            || { echo "MISSING: resources/whisper/models/ggml-base.bin"; exit 1; }
          echo "fetch-whisper produced expected artifacts for $plat"

      - name: Build dist installer
        run: npm run ${{ matrix.dist-script }}
        env:
          # Skip code signing in CI for now — sign + notarize is a
          # follow-on step that needs Apple Developer ID + Authenticode
          # certs configured as repo secrets. CI artifacts produced here
          # are unsigned and intended for internal testing.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Ad-hoc codesign macOS app (no Apple Developer ID required)
        # macOS Gatekeeper rejects an unsigned .app with "손상되었기
        # 때문에 열 수 없습니다" because the package has no signature
        # AND the quarantine xattr is set when the user downloads it.
        # An ad-hoc signature (`-s -`) is enough for Gatekeeper to fall
        # through to the "unidentified developer" prompt, which the user
        # can clear via right-click → Open. This isn't notarization —
        # users on macOS 15+ may still need to allow the app in Settings
        # → Privacy & Security — but it's a strict improvement over a
        # totally unsigned .app, and it costs nothing.
        if: matrix.os == 'macos-latest'
        run: |
          set -e
          shopt -s nullglob
          for app in release/mac*/*.app release/*.app; do
            if [ -d "$app" ]; then
              echo "Ad-hoc signing: $app"
              codesign --force --deep --sign - "$app" || true
            fi
          done

      - name: Verify packaged ffmpeg/ffprobe binaries
        # Confirms the host-OS binary actually landed in the package.
        # If a future change accidentally swaps the unpack rule, this
        # catches it before artifacts are uploaded. The verifier auto-
        # detects host platform (process.platform) and asserts the
        # matching magic number — Mach-O on macOS, PE on Windows, ELF
        # on Linux.
        run: npx tsx scripts/verify-packaged-binaries.ts

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: warn
          retention-days: 14
